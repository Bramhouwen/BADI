<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BADI Wereld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: de wereld vult het scherm; kaartjes zweven in de hoeken, praatbalk onderin */
  --cream:#f7ece4;
  --paper:#fffaf5;
  --ink:#3a2a25;
  --brown:#6e3d30;
  --muted:#8a6f63;
  --line:#e8d8cb;
  --live:#4f8a5b;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(58,42,37,.10)}
#head{position:absolute;left:16px;top:16px;padding:12px 16px 12px;max-width:min(300px,calc(100% - 150px));pointer-events:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--brown);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#c9b5a8;flex:none}
.dot.live{background:var(--live)}
h1{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.05;margin:4px 0 6px;letter-spacing:-.01em}
h1 i{font-weight:500;color:var(--brown)}
#where{font-size:13px;color:var(--muted)}
#where b{color:var(--ink);font-weight:700}
#people{position:absolute;right:16px;top:16px;width:220px;max-width:calc(100% - 32px);padding:6px}
#peopleBtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
#peopleList{padding:4px 10px 8px;font-size:13px;max-height:40vh;overflow:auto}
#peopleList h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;font-weight:700}
#peopleList div.p{display:flex;align-items:center;gap:8px;padding:2px 0}
#peopleList .sw{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(58,42,37,.25)}
#peopleList .empty{color:var(--muted)}
button{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:500}
button:hover{background:#f1e2d6}
button:focus-visible,input:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
button.solid{background:var(--brown);color:#fff}
button.solid:hover{background:#5d3327}
#dock{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;pointer-events:none}
#log{pointer-events:auto;width:min(360px,100%);max-height:150px;overflow:auto;padding:10px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;background:rgba(255,250,245,.92)}
#log:empty{display:none}
#log .m b{font-weight:700}
#log .m.me b{color:var(--brown)}
#log .sys{color:var(--muted);font-style:italic}
#bar{pointer-events:auto;width:100%;display:flex;gap:8px;align-items:center;padding:6px;flex-wrap:wrap}
#say{flex:1 1 180px;min-width:0;font:inherit;color:var(--ink);background:transparent;border:0;padding:9px 12px;border-radius:12px}
#say::placeholder{color:var(--muted)}
#lookPanel{position:absolute;right:16px;bottom:86px;width:280px;max-width:calc(100% - 32px);padding:14px 16px 16px;display:none}
#lookPanel.open{display:block}
#lookPanel h2{font-family:var(--font-display);font-size:19px;margin:0 0 8px;font-weight:600}
#lookPanel .row{margin-top:10px}
#lookPanel .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sws button{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(58,42,37,.2)}
.sws button.txt{width:auto;height:auto;padding:5px 10px;border-radius:999px;font-size:13px;background:#f1e2d6;box-shadow:none}
.sws button[aria-pressed="true"]{border-color:var(--ink)}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:5}
#toast.show{opacity:1}
@media (max-width:600px){
  h1{font-size:22px}
  #head{padding:10px 12px;max-width:calc(100% - 140px)}
  #people{width:auto;min-width:112px}
  #people:not(.open) #peopleList{display:none}
  #log{max-height:92px}
  #lookPanel{bottom:96px}
  #toast{top:auto;bottom:150px;width:max-content}
  #bar{flex-wrap:nowrap;gap:2px}
  #bar button{padding:9px 8px;font-size:14px}
  #say{flex:1 1 60px;padding:9px 8px}
  #say::placeholder{font-size:14px}
}
@media (min-width:601px){#people #peopleBtn .chev{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="De BADI Wereld. Tik op een tegel om erheen te lopen."></canvas>

  <div id="head" class="card">
    <div class="eyebrow"><span class="dot" id="dot"></span><span id="status">BADI</span></div>
    <h1>BADI <i>Wereld</i></h1>
    <div id="where">Je bent <b id="whereName">buiten</b></div>
  </div>

  <div id="people" class="card">
    <button id="peopleBtn" type="button" aria-expanded="false"><span id="peopleCount">Alleen jij</span><span class="chev">Wie is waar</span></button>
    <div id="peopleList"></div>
  </div>

  <div id="lookPanel" class="card" role="dialog" aria-label="Jouw poppetje">
    <h2>Jouw poppetje</h2>
    <div id="lookRows"></div>
  </div>

  <div id="dock">
    <div id="log" class="card" aria-live="polite"></div>
    <form id="bar" class="card" autocomplete="off">
      <input id="say" type="text" maxlength="160" placeholder="Zeg iets" aria-label="Bericht">
      <button class="solid" type="submit" id="sendBtn">Zeg</button>
      <button type="button" id="waveBtn">Zwaai</button>
      <button type="button" id="danceBtn">Dans</button>
      <button type="button" id="lookBtn" aria-expanded="false">Poppetje</button>
    </form>
  </div>
  <div id="toast" role="status"></div>
</div>

<script>
(() => {
'use strict';
const TW = 64, TH = 32;
const $ = s => document.querySelector(s);
const cv = $('#world'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, zoom = 1, scene = null;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  zoom = (W < 600 ? 0.9 : 1.15) * (scene && scene.indoor ? (W < 600 ? 1.1 : 1.25) : 1);
}
window.addEventListener('resize', resize);

/* ---------- iso basis ---------- */
const P = (x, y, z = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - z];
function poly(pts, fill, stroke){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function sh(hex, a){
  const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a)));
  return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1);
}
const C = h => ({ t: h, l: sh(h, -.1), r: sh(h, -.22) });
function box(x, y, w, h, z0, z1, c){
  if (typeof c === 'string') c = C(c);
  poly([P(x, y + h, z0), P(x + w, y + h, z0), P(x + w, y + h, z1), P(x, y + h, z1)], c.l);
  poly([P(x + w, y + h, z0), P(x + w, y, z0), P(x + w, y, z1), P(x + w, y + h, z1)], c.r);
  poly([P(x, y, z1), P(x + w, y, z1), P(x + w, y + h, z1), P(x, y + h, z1)], c.t);
}
const qy = (x0, x1, Y, z0, z1, f, s) => poly([P(x0, Y, z0), P(x1, Y, z0), P(x1, Y, z1), P(x0, Y, z1)], f, s);
const qx = (X, y0, y1, z0, z1, f, s) => poly([P(X, y0, z0), P(X, y1, z0), P(X, y1, z1), P(X, y0, z1)], f, s);
const qt = (x, y, w, h, z, f, s) => poly([P(x, y, z), P(x + w, y, z), P(x + w, y + h, z), P(x, y + h, z)], f, s);
function circ(p, r, f){ ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.fillStyle = f; ctx.fill(); }
function textY(str, x, Y, z, font, fill){ // tekst op een vlak dat naar +y kijkt
  const p = P(x, Y, z); ctx.save(); ctx.translate(p[0], p[1]); ctx.transform(1, .5, 0, 1, 0, 0);
  ctx.font = font; ctx.fillStyle = fill; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, 0, 0); ctx.restore();
}
function textX(str, X, y, z, font, fill){ // tekst op een vlak dat naar +x kijkt (y loopt af)
  const p = P(X, y, z); ctx.save(); ctx.translate(p[0], p[1]); ctx.transform(1, -.5, 0, 1, 0, 0);
  ctx.font = font; ctx.fillStyle = fill; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, 0, 0); ctx.restore();
}
function winY(x0, x1, Y, z0, z1, lit){
  qy(x0, x1, Y, z0, z1, '#7a4a3a');
  qy(x0 + .07, x1 - .07, Y, z0 + 3, z1 - 3, lit ? '#ffe2a0' : '#a9c3d9');
  const m = (x0 + x1) / 2; qy(m - .02, m + .02, Y, z0 + 3, z1 - 3, '#7a4a3a');
}
function winX(X, y0, y1, z0, z1, lit){
  qx(X, y0, y1, z0, z1, '#6b3f31');
  qx(X, y0 + .07, y1 - .07, z0 + 3, z1 - 3, lit ? '#f5d58f' : '#92b0c8');
  const m = (y0 + y1) / 2; qx(X, m - .02, m + .02, z0 + 3, z1 - 3, '#6b3f31');
}
const hash = (x, y) => { let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };

/* ---------- scenes ---------- */
const SC = {};
const key = (x, y) => x + '_' + y;
function makeScene(id, name, w, h, indoor){
  const s = { id, name, w, h, indoor, tile: [], solid: [], act: {}, objs: [], decals: [], labels: [] };
  for (let y = 0; y < h; y++){ s.tile.push(new Array(w).fill(indoor ? 'f' : 'g')); s.solid.push(new Array(w).fill(0)); }
  SC[id] = s; return s;
}
function O(s, x, y, w, h, zh, draw, solid = 1, fp){
  const o = { a: x, b: x + w, c: y, d: y + h, zh, draw, dep: x + w / 2 + y + h / 2 };
  if (fp){ o.a = fp[0]; o.b = fp[1]; o.c = fp[2]; o.d = fp[3]; o.dep = (fp[0] + fp[1] + fp[2] + fp[3]) / 2; }
  s.objs.push(o);
  if (solid) for (let j = Math.floor(y); j < Math.ceil(y + h); j++) for (let i = Math.floor(x); i < Math.ceil(x + w); i++) s.solid[j][i] = solid;
  return o;
}
const occupied = id => everyone().some(e => e.scene === id);

/* --- meubels en natuur --- */
function tree(s, x, y, big){
  O(s, x, y, 1, 1, 80, () => {
    box(x + .42, y + .42, .16, .16, 0, 26, '#8a5a3c');
    const k = big ? 1.2 : 1;
    circ(P(x + .5, y + .5, 36), 17 * k, '#6f9f62'); circ(P(x + .32, y + .6, 46), 14 * k, '#7fae6e');
    circ(P(x + .62, y + .42, 52), 13 * k, '#8aba78'); circ(P(x + .5, y + .5, 62), 10 * k, '#9bc788');
  }, 1, [x + .3, x + .7, y + .3, y + .7]);
}
function lamp(s, x, y){
  O(s, x, y, 1, 1, 70, t => {
    box(x + .46, y + .46, .08, .08, 0, 58, '#4a3b36');
    circ(P(x + .5, y + .5, 62), 6, '#ffe7ad'); circ(P(x + .5, y + .5, 62), 11, 'rgba(255,231,173,.25)');
  }, 1, [x + .4, x + .6, y + .4, y + .6]);
}
function seat(s, x, y, dir, z, kind, col){
  s.act[key(x, y)] = { type: 'seat', dir, z };
  O(s, x, y, 1, 1, 34, () => {
    if (kind === 'bench'){
      if (dir === '+x'){ box(x + .22, y, .56, 1, 7, 11, '#b98a5e'); box(x + .12, y, .1, 1, 0, 26, '#a67648'); }
      else { box(x, y + .22, 1, .56, 7, 11, '#b98a5e'); box(x, y + .12, 1, .1, 0, 26, '#a67648'); }
    } else if (kind === 'sofa'){
      if (dir === '+y'){ box(x, y + .2, 1, .75, 0, 12, col); box(x, y + .05, 1, .2, 0, 30, sh(col, -.08)); }
      else { box(x + .2, y, .75, 1, 0, 12, col); box(x + .05, y, .2, 1, 0, 30, sh(col, -.08)); }
    } else {
      box(x + .22, y + .22, .56, .56, 0, 11, col);
      if (dir === '+y') box(x + .22, y + .14, .56, .1, 11, 30, sh(col, -.1));
      else box(x + .14, y + .22, .1, .56, 11, 30, sh(col, -.1));
    }
  }, 2);
}
function plant(s, x, y){
  O(s, x, y, 1, 1, 50, () => {
    box(x + .34, y + .34, .32, .32, 0, 12, '#c9785c');
    circ(P(x + .5, y + .5, 22), 9, '#6f9f62'); circ(P(x + .4, y + .55, 30), 8, '#7fae6e'); circ(P(x + .58, y + .45, 36), 8, '#8aba78');
  }, 1, [x + .3, x + .7, y + .3, y + .7]);
}
function table(s, x, y, w, h, z, col){
  O(s, x, y, w, h, z + 4, () => {
    box(x + .1, y + .1, .1, .1, 0, z, sh(col, -.25)); box(x + w - .2, y + h - .2, .1, .1, 0, z, sh(col, -.25));
    box(x + .1, y + h - .2, .1, .1, 0, z, sh(col, -.25)); box(x + w - .2, y + .1, .1, .1, 0, z, sh(col, -.25));
    box(x + .04, y + .04, w - .08, h - .08, z, z + 4, col);
  });
}
function desk(s, x, y, w, places){
  O(s, x, y, w, 1, 40, () => {
    box(x + .05, y + .2, .08, .6, 0, 20, '#8a6a52'); box(x + w - .13, y + .2, .08, .6, 0, 20, '#8a6a52');
    box(x, y + .12, w, .76, 20, 24, '#e9d9c6');
    for (const px of places){
      box(px + .3, y + .3, .4, .28, 24, 25.5, '#4a3b36');
      qy(px + .3, px + .7, y + .62, 25, 38, '#3a2a25'); qy(px + .44, px + .56, y + .62, 30, 33, '#e9d9c6');
    }
  });
}

/* --- buiten --- */
const out = makeScene('buiten', 'buiten', 26, 22, false);
(function(){
  const s = out, T = s.tile;
  for (let x = 0; x < 26; x++){ T[10][x] = 'r'; T[11][x] = 'r'; }
  for (let y = 0; y < 22; y++){ T[y][12] = 'r'; T[y][13] = 'r'; }
  const path = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) T[y][x] = 'p'; };
  path(5, 7, 5, 9); path(4, 7, 6, 7);
  path(18, 7, 19, 9); path(16, 7, 21, 7);
  path(8, 12, 8, 20); path(1, 18, 8, 18);
  path(19, 19, 19, 19); path(14, 19, 19, 19);
  for (let y = 14; y <= 16; y++) for (let x = 2; x <= 5; x++){ if ((x === 2 && y === 14) || (x === 5 && y === 16)) continue; T[y][x] = 'w'; s.solid[y][x] = 1; }
  for (let y = 14; y <= 19; y++) for (let x = 9; x <= 11; x++){ T[y][x] = 'plot'; s.solid[y][x] = 1; s.act[key(x, y)] = { type: 'plot' }; }
  const door = (x, y, to, tx, ty) => { T[y][x] = 'door'; s.solid[y][x] = 2; s.act[key(x, y)] = { type: 'door', to, tx, ty, dir: '+x' }; };
  door(5, 6, 'huis', 1, 4); door(18, 6, 'kantoor', 1, 4); door(19, 6, 'kantoor', 1, 4); door(19, 18, 'gym', 1, 3);

  // BADI-huis
  const hs = { x: 3, y: 2, w: 5, h: 4 };
  O(s, hs.x, hs.y, hs.w, hs.h, 140, () => {
    const { x, y, w, h } = hs, Z = 80, lit = occupied('huis');
    box(x, y, w, h, 0, Z, { t: '#d9c7b8', l: '#ecdfd2', r: '#d2bfae' });
    qy(x, x + w, y + h, 0, 7, '#bfa996'); qx(x + w, y, y + h, 0, 7, '#ad9682');
    qy(x + 2.05, x + 2.95, y + h, 0, 58, '#7a4a3a'); qy(x + 2.13, x + 2.87, y + h, 0, 54, '#a55f48');
    circ(P(x + 2.75, y + h, 26), 2, '#f3d28a');
    winY(x + .5, x + 1.5, y + h, 26, 58, lit); winY(x + 3.5, x + 4.5, y + h, 26, 58, lit);
    winX(x + w, y + 2.4, y + 3.4, 26, 58, lit); winX(x + w, y + .6, y + 1.6, 26, 58, lit);
    const o = .3, e0 = Z - 3, r = Z + 50, yc = y + h / 2, a = 1.5;
    box(x + 1.1, y + .9, .45, .45, Z + 10, r + 6, '#b9806a');
    poly([P(x - o, y + h + o, e0), P(x + w + o, y + h + o, e0), P(x + w - a, yc, r), P(x + a, yc, r)], '#96503d');
    poly([P(x + w + o, y + h + o, e0), P(x + w + o, y - o, e0), P(x + w - a, yc, r)], '#7a3e2e');
    poly([P(x - o, y + h + o, e0), P(x + w + o, y + h + o, e0), P(x + w + o, y + h + o, e0 - 4), P(x - o, y + h + o, e0 - 4)], '#6e3d30');
  });
  s.labels.push({ text: 'BADI-HUIS', scene: 'huis', x: 5.5, y: 4, z: 150, door: [5, 6] });

  // Traffic Today
  const of = { x: 16, y: 2, w: 6, h: 4 };
  O(s, of.x, of.y, of.w, of.h, 170, () => {
    const { x, y, w, h } = of, Z = 156, lit = occupied('kantoor');
    box(x, y, w, h, 0, Z, { t: '#dcb77c', l: '#473d39', r: '#342c29' });
    qt(x + .25, y + .25, w - .5, h - .5, Z, '#c9a468');
    for (let k = 0; k < 4; k++){
      const z0 = 60 + k * 24;
      qy(x + .15, x + w - .15, y + h, z0, z0 + 15, lit && k < 2 ? '#bcd3e6' : '#9db9d1');
      qx(x + w, y + .15, y + h - .15, z0, z0 + 15, lit && k < 2 ? '#a9c2d6' : '#86a3bb');
    }
    qy(x + 2, x + 4, y + h, 0, 40, '#f3e2c4'); qy(x + 2.08, x + 2.96, y + h, 0, 37, '#a9c3d9'); qy(x + 3.04, x + 3.92, y + h, 0, 37, '#a9c3d9');
    textY('TRAFFIC TODAY', x + .9, y + h, 44, '700 14px DM Sans, sans-serif', '#f3e2c4');
  });
  s.labels.push({ text: 'TRAFFIC TODAY', scene: 'kantoor', x: 19, y: 4, z: 180, door: [18, 6] });

  // Sportschool
  const gm = { x: 17, y: 14, w: 5, h: 4 };
  O(s, gm.x, gm.y, gm.w, gm.h, 80, () => {
    const { x, y, w, h } = gm, Z = 62, lit = occupied('gym');
    box(x, y, w, h, 0, Z, { t: '#e7d3c2', l: '#cf8468', r: '#b56c53' });
    qy(x, x + w, y + h, Z - 12, Z, '#f3e2c4'); qx(x + w, y, y + h, Z - 12, Z, '#e2cdb0');

function toWorld(cx, cy){
  const r = cv.getBoundingClientRect();

}
function toTile(wx, wy){ return [Math.floor((wx / (TW / 2) + wy / (TH / 2)) / 2), Math.floor((wy / (TH / 2) - wx / (TW / 2)) / 2)]; }
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, px: cam.px, py: cam.py, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  const w = toWorld(e.clientX, e.clientY); hover = e.pointerType === 'mouse' ? toTile(w[0], w[1]) : null;
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 8) drag.moved = true;
  if (drag.moved){ cam.px = drag.px - dx / zoom; cam.py = drag.py - dy / zoom; }
});
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('pointerup', e => {
  const d = drag; drag = null; if (!d || d.moved) return;

  if (scene === out){ const c = catPos(Date.now()), p = P(c.x + .5, c.y + .5); if (Math.hypot(w[0] - p[0], w[1] - p[1] + 10) < 16){ catSay = performance.now() + 1800; return; } }
  const [tx, ty] = toTile(w[0], w[1]);

    if (garden[key(tx, ty)]){ toast('Hier groeit al iets. Kies een leeg stukje grond.'); return; }
    if (!walkNear(tx, ty, () => plantAt(tx, ty))) toast('Daar kun je nu niet bij'); return;

  net.room.presence(o).catch(() => {});
}
const int = (v, max) => Number.isFinite(v) ? Math.max(0, Math.min(max, Math.round(v))) : 0;
function syncPeers(peers){
  const seen = new Set(); let changed = false; const ids = [];
  for (const p of peers){
    if (!p || p.sameTab || p.kind !== 'viewer') continue;
    const pr = p.presence || {}; if (typeof pr.s !== 'string' || !msgs[pr.s]) continue;
    const s = SC[pr.s]; seen.add(p.peer);
    let e = others.get(p.peer); const isNew = !e;
    const tx = int(pr.tx, s.w - 1), ty = int(pr.ty, s.h - 1);
    if (isNew){ e = newEntity(p.peer); e.scene = pr.s; e.x = tx; e.y = ty; e.tx = tx; e.ty = ty; e.lastSay = pr.say && pr.say.id; e.lastEm = pr.em && pr.em.t; others.set(p.peer, e); changed = true;
      if (pr.s === scene.id && started) sysMsg(pr.s, null, e, ' is er ook'); }
    if (e.scene !== pr.s){
      if (e.scene === scene.id) sysMsg(e.scene, null, e, ' gaat weg');
      e.scene = pr.s; e.x = tx; e.y = ty; e.path = []; e.tx = tx; e.ty = ty; changed = true;
      if (pr.s === scene.id) sysMsg(pr.s, null, e, ' komt binnen');
    } else if (e.tx !== tx || e.ty !== ty){
      e.tx = tx; e.ty = ty;
      const path = findPath(s, Math.round(e.x), Math.round(e.y), tx, ty);
      if (path && path.length < 60){ e.path = path; e.state = 'walk'; e.seatZ = 0; } else { e.path = []; e.x = tx; e.y = ty; }
    }
    e.rSt = ['idle', 'sit', 'run', 'dance'].includes(pr.st) ? pr.st : 'idle';
    e.rDir = ['+x', '+y', '-x', '-y'].includes(pr.d) ? pr.d : '+y';
    if (!e.path.length) settle(e, e.rSt, e.rDir);
    const lk = pr.look || {}; const nl = { sk: int(lk.sk, 11), hc: int(lk.hc, 11), hs: int(lk.hs, 3), sh: int(lk.sh, 11), pa: int(lk.pa, 11) };
    if (JSON.stringify(nl) !== JSON.stringify(e.look)){ e.look = nl; changed = true; }
    e.uid = p.by || (typeof pr.uid === 'string' ? pr.uid.slice(0, 80) : null);
    const nick = typeof pr.n === 'string' ? first(pr.n) : '';
    const nm = p.isMe ? (me.name === 'Jij' ? 'Jij (ander tabblad)' : me.name + ' (2)') : (e.uid && names[e.uid]) || nick || 'Iemand';
    if (nm !== e.name){ e.name = nm; changed = true; }
    if (e.uid && !names[e.uid]) ids.push(e.uid);
    if (pr.say && typeof pr.say.text === 'string' && pr.say.id !== e.lastSay){
      e.lastSay = pr.say.id; const text = pr.say.text.slice(0, 160);
      e.bubble = { text, t0: performance.now() };
      addMsg(e.scene, { id: String(pr.say.id).slice(0, 40), by: e.uid, n: e.name, text, t: Number(pr.say.t) || Date.now() });
    }
    if (pr.em && pr.em.t !== e.lastEm){ e.lastEm = pr.em.t; e.wave = performance.now() + 2200; }
  }
  for (const [k, e] of others) if (!seen.has(k)){ others.delete(k); changed = true; if (e.scene === scene.id) sysMsg(e.scene, null, e, ' is weg'); }
  if (changed) renderPeople();
  if (ids.length) resolveNames(ids);
}
function sysMsg(sc, id, e, tail){ addMsg(sc, { id: 'sys' + Math.random().toString(36).slice(2), sys: true, text: (e.name || 'Iemand') + tail, t: Date.now() }); }
function resolveNames(ids){
  if (!net.user) return;
  net.user.profiles([...new Set(ids)]).then(ps => { let ch = false;
    for (const id in ps){ const n = first(ps[id] && ps[id].name); if (n && names[id] !== n){ names[id] = n; ch = true; } }
    if (ch){ for (const e of others.values()) if (e.uid && names[e.uid] && !e.name.includes('(')) e.name = names[e.uid]; renderPeople(); renderLog(); }
  });
}
let writeQ = Promise.resolve();
const chatDocs = {};
function persistMsg(sc, m){
  if (!net.db || net.ro) return;
  writeQ = writeQ.then(async () => {
    const cur = (chatDocs[sc] || []).filter(x => x.id !== m.id);
    const next = cur.concat([{ id: m.id, by: m.by || null, text: m.text, t: m.t }]).slice(-40);
    chatDocs[sc] = next;
    try { await net.db.doc('chat/' + sc).set({ m: next }); } catch (e) { if (e && e.code === 'invalid_argument') net.ro = true; }
  });
}
function plantAt(x, y){
  const k = key(x, y); if (garden[k]) return;
  garden[k] = { k: Math.floor(Math.random() * FLOWER.length), t: Date.now(), by: net.myId || null };
  me.wave = performance.now() + 1200; toast('Geplant. Over een minuutje staat hij in bloei.');
  if (!net.db || net.ro) return;
  writeQ = writeQ.then(async () => { try { await net.db.doc('wereld/tuin').set({ plots: Object.assign({}, garden) }); } catch (e) { if (e && e.code === 'invalid_argument'){ net.ro = true; toast('Je kunt meekijken, maar planten wordt niet bewaard.'); } } });
}
function status(){
  const live = net.room && net.room.connected();
  $('#dot').classList.toggle('live', !!live); $('#status').textContent = live ? 'BADI · LIVE' : net.room ? 'BADI · VERBINDEN' : 'BADI · SOLO';
}
let started = false;
async function initNet(){
  const c = window.claude; if (!c || typeof c.use !== 'function'){ status(); return; }
  const [user, room, db] = await Promise.all([c.use('user'), c.use('room'), c.use('db')]);
  net.user = user; net.db = db;
  if (user){ try { const m = await user.me(); net.myId = m.id || null; const n = first(m.name); if (n){ me.name = n; if (net.myId) names[net.myId] = n; } } catch (e) {} }
  if (db){
    for (const sc of Object.keys(msgs)) db.doc('chat/' + sc).onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null, arr = d && Array.isArray(d.m) ? d.m : [];
      const clean = arr.filter(x => x && typeof x.id === 'string' && typeof x.text === 'string' && Number.isFinite(x.t)).slice(-40)
        .map(x => ({ id: x.id.slice(0, 40), by: typeof x.by === 'string' ? x.by : null, text: x.text.slice(0, 160), t: x.t }));
      chatDocs[sc] = clean; const ids = [];
      for (const x of clean){ if (x.by && !names[x.by]) ids.push(x.by); addMsg(sc, Object.assign({ me: !!x.by && x.by === net.myId }, x)); }
      if (ids.length) resolveNames(ids);
    }, () => {});
    db.doc('wereld/tuin').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null, pl = d && d.plots && typeof d.plots === 'object' ? d.plots : {};
      for (const k in pl){ const v = pl[k]; if (/^\d+_\d+$/.test(k) && out.act[k] && v && Number.isFinite(v.t)) garden[k] = { k: int(v.k, 20), t: v.t, by: typeof v.by === 'string' ? v.by : null }; }
    }, () => {});
  }
  if (room){
    net.room = room;
    room.onConnection(() => status(), () => { net.room = null; status(); });
    room.onPeers(ch => syncPeers(ch.peers), () => {});
    push(); setTimeout(() => { started = true; }, 2500);
  }
  status(); renderPeople(); renderLog();
}

/* ---------- start ---------- */
loadLook(); resize(); renderLook();
enter('buiten', out.spawn[0], out.spawn[1], '+y');
status(); renderPeople();
setTimeout(() => toast('Tik op een tegel om te lopen. Loop een deur in om naar binnen te gaan.'), 600);
requestAnimationFrame(frame);
initNet();
window.__badi = { syncPeers, enter, me, say, walkTo };
})();
</script>
